<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Export MockSignal Icon for Stripe (512x512 PNG)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f8fafc;
      margin: 0;
      color: #0f172a;
    }
    .card {
      background: white;
      padding: 36px;
      border-radius: 24px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      text-align: center;
      max-width: 550px;
    }
    canvas {
      width: 256px;
      height: 256px;
      border-radius: 56px;
      box-shadow: 0 12px 28px -4px rgba(37, 99, 235, 0.35);
      margin: 20px 0;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      transition: all 0.15s ease;
    }
    button:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="margin: 0 0 8px 0; font-size: 20px;">MockSignal Stripe Product Icon</h2>
    <p style="margin: 0 0 20px 0; font-size: 13px; color: #64748b;">
      Renders <code>/mocksignal-icon.svg</code> at high-res 512×512 PNG formatted for Stripe product catalogs.
    </p>
    <canvas id="canvas" width="512" height="512"></canvas>
    <div>
      <button id="downloadBtn">Download 512×512 PNG</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();

    img.onload = () => {
      ctx.clearRect(0, 0, 512, 512);
      ctx.drawImage(img, 0, 0, 512, 512);
    };
    img.src = '/mocksignal-icon.svg';

    document.getElementById('downloadBtn').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'mocksignal-icon.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
